name: Publish signed Android APK
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-stable-release
  cancel-in-progress: false

jobs:
  origin:
    name: Check tag and release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          python3 scripts/release/android.py version "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main

  verify:
    needs: origin
    uses: ./.github/workflows/ci.yml

  sign:
    name: Build and sign
    needs: verify
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - env:
          EXPECTED_SIGNER: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: python3 scripts/release/android.py new-tag "$GITHUB_REF_NAME" --certificate "$EXPECTED_SIGNER"
      - run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash gradlew --no-daemon :app:assembleRelease
      - name: Sign and validate APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_SIGNER: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          for key in KEYSTORE KS_PASS KEY_PASS KEY_ALIAS EXPECTED_SIGNER; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing Android release configuration: $key"; exit 1; fi
          done
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/lumora-keystore.XXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode >"$keystore"
          unset KEYSTORE
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out "$RUNNER_TEMP/lumora-signed.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          unset KS_PASS KEY_PASS
          "$tools/zipalign" -c -P 16 4 "$RUNNER_TEMP/lumora-signed.apk"
          python3 scripts/release/android.py prepare "$GITHUB_REF_NAME" "$RUNNER_TEMP/lumora-signed.apk" dist --certificate "$EXPECTED_SIGNER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Install and launch signed APK
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-assets
          path: dist
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb install -g dist/*.apk
            adb shell am start -W -n com.lumora.camera/.MainActivity | tee startup.txt
            grep -q '^Status: ok' startup.txt
            adb shell pidof com.lumora.camera

  publish:
    name: Publish verified release assets
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-assets
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/android-update.json dist/SHA256SUMS.txt \
            --draft --verify-tag --title "LUMORA Camera ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
          python3 scripts/release/android.py draft "$GITHUB_REF_NAME" dist
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          for delay in 0 5 15; do
            sleep "$delay"
            if python3 scripts/release/android.py public --tag "$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
