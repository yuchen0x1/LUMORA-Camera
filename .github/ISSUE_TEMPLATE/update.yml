name: 安装或更新失败
description: 报告发现版本、下载、校验或系统安装的问题
body:
  - type: input
    id: versions
    attributes:
      label: 当前版本、目标版本、安装来源和 Android 版本
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: 失败阶段和系统提示
      description: 可附去除隐私信息的提示截图
    validations:
      required: true
